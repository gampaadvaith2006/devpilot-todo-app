<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My tasks</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f4f2fb;color:#252039;font:16px/1.5 system-ui,sans-serif;padding:48px 18px}main{max-width:600px;margin:auto;background:white;padding:30px;border-radius:22px;box-shadow:0 12px 50px #36205412}h1{margin:4px 0;font-size:34px;letter-spacing:-1px}.eyebrow{color:#7753c2;font-size:12px;font-weight:700;letter-spacing:2px}.intro{color:#80778f;margin:8px 0 24px}form{display:flex;gap:10px}input[type=text]{min-width:0;flex:1;padding:13px;border:1px solid #dcd5e8;border-radius:10px;font:inherit}button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:12px 17px;background:#7753c2;color:white;font-weight:600}button:focus-visible,input:focus-visible{outline:3px solid #bda4ed;outline-offset:3px}ul{padding:0;list-style:none;margin:22px 0}li{display:flex;align-items:center;gap:12px;padding:15px 0;border-bottom:1px solid #efebf5}li label{flex:1;display:flex;gap:12px;align-items:center;min-width:0}li span{overflow-wrap:anywhere}input[type=checkbox]{width:20px;height:20px;accent-color:#7753c2;flex-shrink:0}.done span{text-decoration:line-through;color:#9a91a8}.delete{background:#f6edf1;color:#a33e61;font-size:13px;padding:7px 11px}.empty{padding:30px 0;text-align:center;color:#9a91a8}.footer{display:flex;justify-content:space-between;color:#8e849b;font-size:13px;border-top:1px solid #efebf5;padding-top:18px}#storage-note{font-size:12px;color:#9a6b34;margin:15px 0 0}@media(max-width:430px){body{padding:25px 12px}main{padding:22px}h1{font-size:29px}form button{padding:12px}.delete{padding:7px}li label{gap:9px}}
</style>
</head>
<body>
<main>
<div class="eyebrow">A LITTLE LESS CHAOS</div>
<h1>My tasks</h1>
<p class="intro">Make a little room for what matters.</p>
<form id="add-form"><input id="task-input" aria-label="New task" maxlength="500" placeholder="What needs doing?" required autocomplete="off"><button type="submit">Add task</button></form>
<ul id="tasks" aria-label="Your tasks"></ul>
<p id="empty" class="empty">A clean slate. Add your first task above.</p>
<div class="footer"><span id="remaining" role="status"></span><span id="completed"></span></div>
<p id="storage-note" hidden>Browser storage is unavailable in this isolated preview. Download and open the app to save tasks between visits.</p>
</main>
<script>
(() => {
  const key = 'devpilot-todo-v1';
  let tasks = [];
  const list = document.getElementById('tasks');
  const input = document.getElementById('task-input');
  function unavailable() { document.getElementById('storage-note').hidden = false; }
  try {
    const saved = JSON.parse(localStorage.getItem(key) || '[]');
    if (Array.isArray(saved)) tasks = saved.filter(t => t && typeof t.id === 'string' && typeof t.text === 'string' && typeof t.completed === 'boolean');
  } catch { unavailable(); }
  function save() { try { localStorage.setItem(key, JSON.stringify(tasks)); } catch { unavailable(); } }
  function render() {
    list.replaceChildren();
    for (const task of tasks) {
      const item = document.createElement('li');
      item.classList.toggle('done', task.completed);
      const label = document.createElement('label');
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = task.completed;
      checkbox.addEventListener('change', () => { task.completed = checkbox.checked; save(); render(); });
      const text = document.createElement('span');
      text.textContent = task.text;
      label.append(checkbox, text);
      const remove = document.createElement('button');
      remove.type = 'button';
      remove.className = 'delete';
      remove.textContent = 'Delete';
      remove.setAttribute('aria-label', 'Delete ' + task.text);
      remove.addEventListener('click', () => { tasks = tasks.filter(t => t.id !== task.id); save(); render(); });
      item.append(label, remove);
      list.append(item);
    }
    document.getElementById('empty').hidden = tasks.length > 0;
    const done = tasks.filter(t => t.completed).length;
    document.getElementById('remaining').textContent = (tasks.length - done) + ' remaining';
    document.getElementById('completed').textContent = done + ' completed';
  }
  document.getElementById('add-form').addEventListener('submit', event => {
    event.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    tasks.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2), text, completed: false });
    save(); render(); input.value = ''; input.focus();
  });
  render();
})();
</script>
</body>
</html>
